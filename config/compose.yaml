services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: creator_hub
      POSTGRES_USER: creator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creator -d creator_hub"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
